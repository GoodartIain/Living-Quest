<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Quest</title>
<style>
  :root { --bg:#f6f3ee; --fg:#1f1d1a; --muted:#6b655c; --card:#fff; --line:#ddd5c8; --accent:#7a4b1f; --note:#fdf4e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --fg:#ece6dc; --muted:#a39a8c; --card:#211e18; --line:#3a352c; --accent:#e0a66a; --note:#2b2418; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0; }
  h2 { font-size:16px; margin:0 0 8px; } h3 { font-size:14px; margin:12px 0 4px; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin:8px 0; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); }
  label.inline { flex-direction:row; gap:4px; align-items:center; }
  input, select, textarea, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  textarea { width:100%; min-height:90px; }
  button { background:var(--accent); color:var(--card); border:none; cursor:pointer; }
  button.link { background:none; color:var(--accent); padding:0; text-decoration:underline; }
  .row { display:grid; grid-template-columns: minmax(0,3fr) minmax(0,2fr); gap:16px; align-items:start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .crumbs { display:flex; gap:6px; flex-wrap:wrap; color:var(--muted); }
  svg.map { width:100%; aspect-ratio:4/3; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .pin circle { fill:var(--accent); cursor:pointer; } .pin text { fill:var(--fg); font-size:3px; }
  .muted { color:var(--muted); font-size:13px; } .err { color:#c0392b; min-height:1.5em; }
  svg.board { width:100%; height:auto; max-height:75vh; background:#d9cdb8; border-radius:6px; touch-action:none; user-select:none; }
  .board .tok text { font-size:0.32px; fill:#fff; paint-order:stroke; stroke:#000; stroke-width:0.06px; pointer-events:none; }
  .modes button[aria-pressed=true] { outline:2px solid var(--fg); }
  .turn { font-weight:600; }
  .note { background:var(--note); border-radius:6px; padding:8px; margin:8px 0; }
  .prose p { white-space:pre-wrap; margin:6px 0; }
  ul { padding-left:18px; margin:4px 0; }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--accent); }
</style>
</head>
<body>
<header><h1>Living Quest</h1><span id="who" class="muted"></span></header>
<main id="app"></main>
<p id="err" class="err" role="alert" style="padding:0 16px"></p>
<script src="markdown.js"></script>
<script src="sheet.js"></script>
<script>
const $app = document.getElementById('app');
let token = localStorage.getItem('lq-token');
// loc: current location view; page: a non-location page open beside the map; results: search hits.
const state = { world: null, loc: null, page: null, pages: [], results: null, pick: null, scene: null, chars: [], wizard: null, character: null, lastRoll: null };

// Build DOM with textContent only, so user-entered text never becomes HTML.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(tag === 'svg' || attrs.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'svg') continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const field = (label, input) => h('label', {}, label, input);
const check = (label, name, on) => h('label', { class: 'inline' }, h('input', { type: 'checkbox', name, checked: on || false }), label);
const options = (list, sel) => list.map((v) => h('option', { value: v, selected: v === sel || false }, v));
const linkTo = (p, label) => h('button', { class: 'link', onclick: () => run(() => openPage(p.id)) }, label || p.title);

function markdown(src) {
  const inl = (parts) => parts.map((t) => typeof t === 'string' ? t : t.b ? h('strong', {}, inl(t.b)) : t.i ? h('em', {}, inl(t.i)) : linkTo({ id: t.link }, t.text));
  return h('div', { class: 'prose' }, parseMarkdown(src).map((b) => b.tag === 'ul' ? h('ul', {}, b.items.map((i) => h('li', {}, inl(i)))) : h(b.tag, {}, inl(b.inline))));
}

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'content-type': 'application/json', ...(token && { authorization: 'Bearer ' + token }) }, body: body && JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw Object.assign(new Error(data.error), { status: res.status });
  return data;
}
async function run(fn) {
  document.getElementById('err').textContent = '';
  try { await fn(); } catch (e) { document.getElementById('err').textContent = e.message; if (e.status === 401) { token = null; localStorage.removeItem('lq-token'); render(); } }
}
function onSubmit(fn) { return (e) => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); run(() => fn(f, e.target)); }; }

let renders = 0;
async function render() {
  const n = ++renders;
  $app.replaceChildren();
  if (!token) {
    document.getElementById('who').textContent = '';
    return $app.append(h('section', {}, h('h2', {}, 'Sign in'),
      h('p', { class: 'muted' }, 'Development sign-in: pick a display name. Your session token is kept in this browser.'),
      h('form', { onsubmit: onSubmit(async (f) => { const r = await api('POST', '/api/users', f); token = r.token; localStorage.setItem('lq-token', token); render(); }) },
        field('Name', h('input', { name: 'name', required: true })), h('button', {}, 'Continue'))));
  }
  const me = await api('GET', '/api/me');
  if (n !== renders) return; // a newer render started while we waited
  document.getElementById('who').textContent = 'Signed in as ' + me.user.name;
  if (state.world) return renderWorld();
  $app.append(
    h('section', {}, h('h2', {}, 'Your worlds'),
      me.worlds.length ? h('ul', {}, me.worlds.map((w) => h('li', {}, h('button', { class: 'link', onclick: () => run(() => openWorld(w.id)) }, w.name), ` — ${w.role}`))) : h('p', { class: 'muted' }, 'None yet.')),
    h('section', {}, h('h2', {}, 'Create a world'),
      h('form', { onsubmit: onSubmit(async (f) => { const w = await api('POST', '/api/worlds', f); await openWorld(w.id); }) },
        field('Name', h('input', { name: 'name', required: true })),
        field('Advancement', h('select', { name: 'advancement' }, options(['milestone', 'xp'], 'milestone'))),
        field('NPC autonomy', h('select', { name: 'npcAutonomy' }, options(['static', 'scheduled', 'reactive', 'simulated', 'ai-assisted'], 'scheduled'))),
        h('button', {}, 'Create'))),
    h('section', {}, h('h2', {}, 'Join with an invite code'),
      h('form', { onsubmit: onSubmit(async (f) => { const r = await api('POST', `/api/invites/${encodeURIComponent(f.code.trim())}/accept`); await openWorld(r.worldId); }) },
        field('Code', h('input', { name: 'code', required: true })), h('button', {}, 'Join'))));
}

async function openWorld(id) {
  state.world = await api('GET', `/api/worlds/${id}`);
  state.pages = await api('GET', `/api/worlds/${id}/pages`);
  state.results = null; state.wizard = null; state.character = null;
  await loadCharacters();
  await go(state.world.rootLocationId);
}
async function go(locId) {
  closeScene();
  state.loc = await api('GET', `/api/locations/${locId}`);
  state.page = null; state.pick = null; state.character = null; state.wizard = null;
  render();
}
async function openPage(id) {
  const v = await api('GET', `/api/pages/${id}`);
  if (v.page.locationId) return go(v.page.locationId);
  state.page = v;
  render();
}
async function refresh() {
  state.pages = await api('GET', `/api/worlds/${state.world.id}/pages`);
  const pageId = state.page && state.page.page.id;
  await go(state.loc.location.id);
  if (pageId) await openPage(pageId);
}

function renderWorld() {
  const w = state.world, v = state.loc, gm = w.role === 'gm';
  if (state.scene) return renderScene();
  if (state.wizard) return renderWizard();
  if (state.character) return renderSheet();
  $app.append(h('section', {},
    h('div', { class: 'crumbs' }, h('button', { class: 'link', onclick: () => { state.world = null; render(); } }, 'All worlds'), '›', h('strong', {}, w.name), h('span', {}, `(${w.role})`)),
    h('p', { class: 'muted' }, `Ruleset ${w.settings.ruleset} · default advancement ${w.settings.advancement} · NPC autonomy ${w.settings.npcAutonomy}`),
    gm ? campaignsPanel(w) : h('p', { class: 'muted' }, 'Campaigns: ' + w.campaigns.map((c) => `${c.name} (${c.advancement.mode})`).join(', ')),
    h('form', { role: 'search', onsubmit: onSubmit(async (f) => { state.results = await api('GET', `/api/worlds/${w.id}/pages?q=${encodeURIComponent(f.q)}`); render(); }) },
      field('Search the wiki (empty lists all)', h('input', { name: 'q', type: 'search' })), h('button', {}, 'Search')),
    state.results && h('div', {}, state.results.length
      ? h('ul', {}, state.results.map((p) => h('li', {}, linkTo(p), ` — ${p.kind}`)))
      : h('p', { class: 'muted' }, 'No matches.')),
    gm && h('form', { onsubmit: onSubmit(async (f) => { const p = await api('POST', `/api/worlds/${w.id}/pages`, f); state.pages = await api('GET', `/api/worlds/${w.id}/pages`); await openPage(p.id); }) },
      field('New entry', h('input', { name: 'title', required: true })),
      field('Kind', h('input', { name: 'kind', value: 'npc', list: 'kinds', size: 8 })),
      h('datalist', { id: 'kinds' }, options(['npc', 'creature', 'faction', 'item', 'event', 'quest', 'religion', 'culture', 'lore'])),
      field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], 'party'))),
      h('button', {}, 'Create entry'))));
  $app.append(charactersPanel());

  const pins = v.children.map((c) => h('g', { svg: 1, class: 'pin', tabindex: 0, role: 'button', 'aria-label': `Open ${c.name}`,
      onclick: () => run(() => go(c.id)), onkeydown: (e) => e.key === 'Enter' && run(() => go(c.id)) },
    h('circle', { svg: 1, cx: c.x, cy: c.y * 0.75, r: 1.6 }), h('text', { svg: 1, x: c.x + 2.2, y: c.y * 0.75 + 1 }, c.name)));
  const pick = state.pick && h('circle', { svg: 1, cx: state.pick.x, cy: state.pick.y * 0.75, r: 1.2, fill: 'none', stroke: 'currentColor', 'stroke-width': 0.4 });
  const svg = h('svg', { class: 'map', viewBox: '0 0 100 75', role: 'img', 'aria-label': v.map.name },
    v.map.imageUrl && h('image', { svg: 1, href: v.map.imageUrl, x: 0, y: 0, width: 100, height: 75, preserveAspectRatio: 'xMidYMid slice' }), pins, pick);
  if (gm) svg.addEventListener('click', (e) => {
    if (e.target.closest('.pin')) return;
    const r = svg.getBoundingClientRect();
    state.pick = { x: Math.round(((e.clientX - r.left) / r.width) * 100), y: Math.round(((e.clientY - r.top) / r.height) * 100) };
    render();
  });

  $app.append(h('div', { class: 'row' },
    h('section', {},
      h('nav', { class: 'crumbs', 'aria-label': 'Breadcrumbs' }, v.breadcrumbs.flatMap((b, i) => [i ? '›' : null, i === v.breadcrumbs.length - 1 ? h('strong', {}, b.name) : h('button', { class: 'link', onclick: () => run(() => go(b.id)) }, b.name)])),
      h('h2', {}, `${v.location.name} `, h('span', { class: 'muted' }, v.location.type)),
      svg,
      v.children.length ? h('ul', {}, v.children.map((c) => h('li', {}, h('button', { class: 'link', onclick: () => run(() => go(c.id)) }, c.name), ` — ${c.type}`,
        gm ? ` [${c.visibility}${c.requiresDiscovery ? ', needs discovery' : ''}]` : ''))) : h('p', { class: 'muted' }, 'No known places here.'),
      h('h3', {}, 'Scenes'),
      v.scenes.length ? h('ul', {}, v.scenes.map((s) => h('li', {}, h('button', { class: 'link', onclick: () => run(() => openScene(s.id)) }, s.name), gm ? ` [${s.visibility}]` : '')))
        : h('p', { class: 'muted' }, 'No scenes here.'),
      gm && h('form', { onsubmit: onSubmit(async (f) => { const s = await api('POST', `/api/locations/${v.location.id}/scenes`, { name: f.name, grid: f.grid, cols: +f.cols, rows: +f.rows }); await openScene(s.id); }) },
        field('New scene', h('input', { name: 'name', required: true })),
        field('Grid', h('select', { name: 'grid' }, options(['square', 'none'], 'square'))),
        field('Columns', h('input', { name: 'cols', type: 'number', min: 1, max: 200, value: 20, size: 3 })),
        field('Rows', h('input', { name: 'rows', type: 'number', min: 1, max: 200, value: 15, size: 3 })),
        h('button', {}, 'Create scene')),
      gm && addPlaceForm(v), gm && locationSettings(v)),
    pagePanel(state.page || v, gm)));
}

function campaignsPanel(w) {
  return [
    h('ul', {}, w.campaigns.map((c) => h('li', {}, `${c.name}: ${c.advancement.mode} (from ${c.advancement.source}) `,
      h('button', { class: 'link', onclick: () => run(async () => {
        const mode = c.advancement.mode === 'xp' ? 'milestone' : 'xp';
        try { await api('PATCH', `/api/campaigns/${c.id}/advancement`, { mode }); }
        catch (e) { if (e.status !== 409 || !confirm(e.message)) throw e; await api('PATCH', `/api/campaigns/${c.id}/advancement`, { mode, confirm: true }); }
        await openWorld(w.id);
      }) }, 'switch mode'), ' · ',
      h('button', { class: 'link', onclick: () => run(async () => { const r = await api('POST', `/api/campaigns/${c.id}/invites`, { role: 'player' }); prompt('Player invite code (single use):', r.code); }) }, 'invite player'), ' · ',
      h('button', { class: 'link', onclick: () => run(async () => { const r = await api('POST', `/api/campaigns/${c.id}/invites`, { role: 'spectator' }); prompt('Spectator invite code (single use):', r.code); }) }, 'invite spectator')))),
    h('form', { onsubmit: onSubmit(async (f) => { await api('POST', `/api/worlds/${w.id}/campaigns`, f.advancement ? f : { name: f.name }); await openWorld(w.id); }) },
      field('New campaign', h('input', { name: 'name', required: true })),
      field('Advancement', h('select', { name: 'advancement' }, h('option', { value: '' }, `inherit (${w.settings.advancement})`), options(['milestone', 'xp']))),
      h('button', {}, 'Create campaign')),
  ];
}

function addPlaceForm(v) {
  return h('form', { onsubmit: onSubmit(async (f) => {
      if (!state.pick) throw new Error('Click the map to choose where the place goes.');
      await api('POST', `/api/locations/${v.location.id}/children`, { name: f.name, type: f.type, visibility: f.visibility, requiresDiscovery: !!f.requiresDiscovery, ...state.pick });
      await refresh();
    }) },
    field('New place', h('input', { name: 'name', required: true })),
    field('Type', h('input', { name: 'type', value: v.location.type === 'world' ? 'town' : 'building', size: 8 })),
    field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], 'party'))),
    check('Hidden until discovered', 'requiresDiscovery'),
    h('button', {}, state.pick ? `Add at ${state.pick.x},${state.pick.y}` : 'Click map, then add'));
}

function locationSettings(v) {
  const loc = v.location;
  return h('details', {}, h('summary', {}, 'Place settings'),
    h('form', { onsubmit: onSubmit(async (f) => {
        await api('PATCH', `/api/locations/${loc.id}`, { visibility: f.visibility, requiresDiscovery: !!f.requiresDiscovery });
        if (f.imageUrl !== v.map.imageUrl) await api('PATCH', `/api/maps/${v.map.id}`, { imageUrl: f.imageUrl });
        await refresh();
      }) },
      field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], loc.visibility))),
      check('Hidden until discovered', 'requiresDiscovery', loc.requiresDiscovery),
      h('label', { style: 'width:100%' }, 'Map image URL', h('input', { name: 'imageUrl', type: 'url', value: v.map.imageUrl })),
      h('button', {}, 'Save place')),
    loc.requiresDiscovery && h('div', {}, h('p', { class: 'muted' }, 'Discovered by:'),
      state.world.campaigns.map((c) => h('label', { class: 'inline' },
        h('input', { type: 'checkbox', checked: loc.discoveredIn.includes(c.id) || false,
          onchange: (e) => run(async () => { await api('PUT', `/api/locations/${loc.id}/discovery`, { campaignId: c.id, discovered: e.target.checked }); await refresh(); }) }),
        c.name))));
}

function pagePanel(v, gm) {
  const p = v.page;
  return h('section', {},
    state.page && h('button', { class: 'link', onclick: () => { state.page = null; render(); } }, `‹ back to ${state.loc.location.name}`),
    h('h2', {}, p.title, ' ', h('span', { class: 'muted' }, p.kind + (gm && !p.locationId ? ` · ${p.visibility}` : ''))),
    p.body ? markdown(p.body) : h('p', { class: 'muted' }, 'Nothing written yet.'),
    gm && p.gmNotes && h('div', { class: 'note' }, h('strong', {}, 'GM notes'), markdown(p.gmNotes)),
    h('h3', {}, 'Connections'),
    v.relationships.length ? h('ul', {}, v.relationships.map((r) => h('li', {},
      r.outgoing ? [`${r.kind} `, linkTo(r.other)] : [linkTo(r.other), ` ${r.kind} this`],
      gm && [` [${r.visibility}] `, h('button', { class: 'link', 'aria-label': 'Remove connection', onclick: () => run(async () => { await api('DELETE', `/api/relationships/${r.id}`); await refresh(); }) }, 'remove')])))
      : h('p', { class: 'muted' }, 'None known.'),
    gm && h('form', { onsubmit: onSubmit(async (f) => { await api('POST', `/api/worlds/${state.world.id}/relationships`, { ...f, [f.dir === 'from' ? 'toId' : 'fromId']: p.id, [f.dir === 'from' ? 'fromId' : 'toId']: f.other, other: undefined, dir: undefined }); await refresh(); }) },
      field('Entry', h('select', { name: 'other', required: true }, state.pages.filter((x) => x.id !== p.id).map((x) => h('option', { value: x.id }, `${x.title} (${x.kind})`)))),
      field('Direction', h('select', { name: 'dir' }, h('option', { value: 'from' }, 'entry → this'), h('option', { value: 'to' }, 'this → entry'))),
      field('Relation', h('input', { name: 'kind', required: true, placeholder: 'lives at', size: 10 })),
      field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], 'party'))),
      h('button', {}, 'Connect')),
    v.backlinks.length > 0 && [h('h3', {}, 'Mentioned in'), h('ul', {}, v.backlinks.map((b) => h('li', {}, linkTo(b))))],
    gm && pageEditor(v));
}

function pageEditor(v) {
  const p = v.page;
  const history = h('ul', {});
  return h('details', {}, h('summary', {}, 'Edit entry'),
    h('form', { onsubmit: onSubmit(async (f) => {
        await api('PATCH', `/api/pages/${p.id}`, { title: f.title, body: f.body, gmNotes: f.gmNotes, ...(!p.locationId && { kind: f.kind, visibility: f.visibility }) });
        await refresh();
      }) },
      field('Title', h('input', { name: 'title', value: p.title, required: true })),
      !p.locationId && [field('Kind', h('input', { name: 'kind', value: p.kind, size: 8 })),
        field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], p.visibility)))],
      h('p', { class: 'muted', style: 'width:100%;margin:0' }, 'Markdown: # heading, **bold**, *italic*, - list. Link entries with [[Entry title]].'),
      h('label', { style: 'width:100%' }, 'Player-facing text', h('textarea', { name: 'body' }, p.body)),
      h('label', { style: 'width:100%' }, 'GM-only notes', h('textarea', { name: 'gmNotes' }, p.gmNotes)),
      h('button', {}, 'Save')),
    h('details', { ontoggle: (e) => e.target.open && run(async () => {
        const revs = await api('GET', `/api/pages/${p.id}/history`);
        history.replaceChildren(...(revs.length ? revs.map((r) => h('li', {}, new Date(r.at).toLocaleString(), ` — ${r.title} `,
          h('button', { class: 'link', onclick: () => run(async () => { await api('PATCH', `/api/pages/${p.id}`, { title: r.title, body: r.body, gmNotes: r.gmNotes }); await refresh(); }) }, 'restore')))
          : [h('li', { class: 'muted' }, 'No earlier versions.')]));
      }) }, h('summary', {}, 'History'), history));
}

// ---- Milestone 3: live 2D scene. The server pushes a per-viewer projection; we only draw what arrives.
function closeScene() {
  if (state.scene) state.scene.es.close();
  state.scene = null;
}
async function openScene(id) {
  closeScene();
  state.world = await api('GET', `/api/worlds/${state.world.id}`); // fresh member list for token controllers
  await loadCharacters();
  const first = await api('GET', `/api/scenes/${id}`); // surfaces permission errors before streaming
  const es = new EventSource(`/api/scenes/${id}/stream?token=${encodeURIComponent(token)}`);
  state.scene = { id, es, view: first, mode: 'move', drag: null, measure: null, busy: false, stale: false };
  // Never redraw mid-gesture: replacing the SVG would drop the pointer capture.
  es.onmessage = (e) => { const sc = state.scene; if (!sc || sc.es !== es) return; sc.view = JSON.parse(e.data); if (sc.busy) sc.stale = true; else { drawBoard(); drawEncounter(); } };
  es.addEventListener('gone', () => { closeScene(); document.getElementById('err').textContent = 'This scene is no longer shared with you.'; render(); });
  render();
}

function renderScene() {
  const sc = state.scene, v = sc.view, gm = v.role === 'gm';
  const modes = [['move', 'Move'], ['measure', 'Measure'], ...(gm ? [['reveal', 'Reveal fog'], ['hide', 'Hide fog'], ['place', 'Place token']] : [])];
  $app.append(h('section', {},
    h('div', { class: 'crumbs' }, h('button', { class: 'link', onclick: () => run(() => go(state.loc.location.id)) }, `‹ ${state.loc.location.name}`), '›', h('strong', {}, v.scene.name), h('span', {}, `(${v.role})`)),
    h('div', { class: 'modes', role: 'toolbar', 'aria-label': 'Board tools', style: 'display:flex;gap:6px;flex-wrap:wrap;margin:8px 0' },
      modes.map(([m, label]) => h('button', { 'aria-pressed': String(sc.mode === m), onclick: (e) => {
        sc.mode = m; sc.measure = null; // redraw only the board, so half-filled forms survive
        e.target.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === e.target)));
        drawBoard();
      } }, label)),
      h('span', { id: 'readout', class: 'muted', 'aria-live': 'polite' }))));
  $app.append(h('div', { class: 'row' },
    h('section', {}, h('div', { id: 'board' })),
    h('section', {}, h('div', { id: 'enc' }), diceBox(v), gm && sceneGmTools(v))));
  drawBoard(); drawEncounter();
}

function boardPoint(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

function drawBoard() {
  const host = document.getElementById('board');
  if (!host) return;
  const sc = state.scene, { scene, tokens, role, encounter } = sc.view, gm = role === 'gm';
  const S = (tag, a, ...k) => h(tag, { svg: 1, ...a }, ...k);
  const svg = h('svg', { class: 'board', viewBox: `0 0 ${scene.cols} ${scene.rows}`, role: 'application', 'aria-label': `${scene.name} board` });
  if (scene.backgroundUrl) svg.append(S('image', { href: scene.backgroundUrl, width: scene.cols, height: scene.rows, preserveAspectRatio: 'none' }));
  if (scene.grid === 'square') {
    const d = [];
    for (let x = 0; x <= scene.cols; x++) d.push(`M${x} 0V${scene.rows}`);
    for (let y = 0; y <= scene.rows; y++) d.push(`M0 ${y}H${scene.cols}`);
    svg.append(S('path', { d: d.join(''), stroke: '#0003', 'stroke-width': 0.03, fill: 'none' }));
  }
  if (scene.fog.enabled) {
    const open = new Set(scene.fog.revealed), d = [];
    for (let x = 0; x < scene.cols; x++) for (let y = 0; y < scene.rows; y++) if (!open.has(`${x},${y}`)) d.push(`M${x} ${y}h1v1h-1z`);
    svg.append(S('path', { d: d.join(''), fill: '#111', opacity: gm ? 0.45 : 1, 'shape-rendering': 'crispEdges' }));
  }
  for (const t of tokens) {
    const r = t.size / 2;
    const g = S('g', { class: 'tok', transform: `translate(${t.x + r} ${t.y + r})`, 'data-id': t.id, style: t.mine && sc.mode === 'move' ? 'cursor:grab' : '' },
      encounter && encounter.turnTokenId === t.id && S('circle', { r: r * 0.98, fill: 'none', stroke: '#ffd54a', 'stroke-width': 0.12 }),
      S('circle', { r: r * 0.8, fill: t.color, stroke: t.mine ? '#fff' : '#0008', 'stroke-width': 0.06, opacity: t.visibility === 'gm' ? 0.6 : 1, 'stroke-dasharray': t.visibility === 'gm' ? '0.15 0.1' : null }),
      S('text', { y: r * 0.8 + 0.35, 'text-anchor': 'middle' }, t.name),
      t.character && t.character.hp && [S('rect', { x: -r * 0.8, y: -r * 0.98, width: r * 1.6, height: 0.12, fill: '#0008' }),
        S('rect', { x: -r * 0.8, y: -r * 0.98, height: 0.12, width: r * 1.6 * Math.max(0, Math.min(1, t.character.hp.current / t.character.hp.max)),
          fill: t.character.hp.current * 2 > t.character.hp.max ? '#3c9a4a' : t.character.hp.current * 4 > t.character.hp.max ? '#d9a21b' : '#c0392b' })],
      t.character && t.character.conditions.length > 0 && S('circle', { cx: r * 0.7, cy: -r * 0.7, r: 0.14, fill: '#8e44ad' }),
      S('title', {}, [t.name, t.character && t.character.hp && `HP ${t.character.hp.current}/${t.character.hp.max}`,
        t.character && t.character.conditions.join(', ')].filter(Boolean).join(' · ')));
    svg.append(g);
  }
  const overlay = S('g', { 'pointer-events': 'none' });
  const paintOverlay = () => overlay.replaceChildren(...[
    sc.measure && S('line', { x1: sc.measure.a.x, y1: sc.measure.a.y, x2: sc.measure.b.x, y2: sc.measure.b.y, stroke: '#c0392b', 'stroke-width': 0.08, 'stroke-dasharray': '0.2 0.1' }),
    sc.rect && S('rect', { ...sc.rect, fill: sc.mode === 'reveal' ? '#fff5' : '#0005', stroke: '#fff', 'stroke-width': 0.05 }),
  ].filter(Boolean));
  paintOverlay();
  svg.append(overlay);

  const cellOf = (p) => ({ x: clamp(Math.floor(p.x), 0, scene.cols - 1), y: clamp(Math.floor(p.y), 0, scene.rows - 1) });
  svg.addEventListener('pointerdown', (e) => {
    const p = boardPoint(svg, e);
    const tokEl = e.target.closest('.tok');
    if (sc.mode === 'move' && tokEl) {
      const t = tokens.find((x) => x.id === tokEl.dataset.id);
      if (!t || !t.mine) return;
      sc.drag = { t, el: tokEl, dx: p.x - t.x, dy: p.y - t.y, x: t.x, y: t.y };
    } else if (sc.mode === 'measure') sc.measure = { a: p, b: p };
    else if (sc.mode === 'reveal' || sc.mode === 'hide') sc.fogStart = cellOf(p);
    else return;
    sc.busy = true;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', (e) => {
    const p = boardPoint(svg, e);
    if (sc.drag) {
      const d = sc.drag, r = d.t.size / 2;
      d.x = clamp(p.x - d.dx, 0, scene.cols - d.t.size); d.y = clamp(p.y - d.dy, 0, scene.rows - d.t.size);
      if (scene.grid === 'square') { d.x = Math.round(d.x); d.y = Math.round(d.y); }
      d.el.setAttribute('transform', `translate(${d.x + r} ${d.y + r})`);
    } else if (sc.measure && e.buttons) {
      sc.measure.b = p;
      const dx = Math.abs(p.x - sc.measure.a.x), dy = Math.abs(p.y - sc.measure.a.y);
      // SRD 5e grid rule: every square, diagonal or not, is 5 ft.
      const cells = scene.grid === 'square' ? Math.max(Math.abs(cellOf(p).x - cellOf(sc.measure.a).x), Math.abs(cellOf(p).y - cellOf(sc.measure.a).y)) : Math.hypot(dx, dy);
      document.getElementById('readout').textContent = `${+cells.toFixed(1)} squares · ${Math.round(cells * 5)} ft`;
      paintOverlay();
    } else if (sc.fogStart && e.buttons) {
      const c = cellOf(p), a = sc.fogStart;
      sc.rect = { x: Math.min(a.x, c.x), y: Math.min(a.y, c.y), width: Math.abs(a.x - c.x) + 1, height: Math.abs(a.y - c.y) + 1 };
      paintOverlay();
    }
  });
  svg.addEventListener('pointercancel', () => { sc.busy = false; sc.drag = null; sc.fogStart = null; sc.rect = null; drawLater(); });
  svg.addEventListener('pointerup', (e) => {
    const p = boardPoint(svg, e);
    sc.busy = false;
    if (sc.stale) { sc.stale = false; drawEncounter(); if (!sc.drag) drawLater(); }
    if (sc.drag) {
      const d = sc.drag; sc.drag = null;
      // On failure the next draw snaps the token back to the server's position.
      if (d.x !== d.t.x || d.y !== d.t.y) run(() => api('PATCH', `/api/tokens/${d.t.id}`, { x: d.x, y: d.y })).then(() => drawBoard());
      else drawBoard();
    } else if (sc.fogStart) {
      const a = sc.fogStart, c = cellOf(p); sc.fogStart = null; sc.rect = null;
      run(() => api('POST', `/api/scenes/${scene.id}/fog`, { x0: a.x, y0: a.y, x1: c.x, y1: c.y, reveal: sc.mode === 'reveal' }));
    } else if (sc.mode === 'place') {
      const f = Object.fromEntries(new FormData(document.getElementById('tokform')));
      const c = cellOf(p), size = +f.size || 1;
      run(() => api('POST', `/api/scenes/${scene.id}/tokens`, { name: f.name || 'Token', color: f.color, visibility: f.visibility, size,
        x: clamp(c.x, 0, scene.cols - size), y: clamp(c.y, 0, scene.rows - size),
        ...(f.characterId ? { characterId: f.characterId, ...(f.controller && { controlledBy: [f.controller] }) } : { controlledBy: f.controller ? [f.controller] : [] }) }));
    }
  });
  host.replaceChildren(svg);
}
let drawQueued = false;
function drawLater() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(() => { drawQueued = false; drawBoard(); }); } }

function drawEncounter() {
  const host = document.getElementById('enc');
  if (!host) return;
  const { scene, tokens, encounter, role, rolls } = state.scene.view, gm = role === 'gm';
  const log = document.getElementById('rolllog');
  if (log) log.replaceChildren(...(rolls.length ? rolls.slice(0, 10).map((r) => h('li', {}, formatRoll(r))) : [h('li', { class: 'muted' }, 'No rolls yet.')]));
  const name = (id) => (tokens.find((t) => t.id === id) || {}).name || '?';
  const put = (combatants) => run(() => api('PUT', `/api/scenes/${scene.id}/encounter`, { combatants }));
  host.replaceChildren(h('div', {}, h('h2', {}, 'Encounter'),
    !encounter ? [h('p', { class: 'muted' }, 'No encounter running.'),
      gm && tokens.length > 0 && h('button', { onclick: () => put(tokens.map((t) => ({ tokenId: t.id, initiative: 0 }))) }, 'Start with all tokens')]
    : [h('p', {}, `Round ${encounter.round}`),
      h('ol', {}, encounter.combatants.map((c) => h('li', { class: c.tokenId === encounter.turnTokenId ? 'turn' : '', 'aria-current': c.tokenId === encounter.turnTokenId ? 'true' : null },
        `${name(c.tokenId)} — ${c.initiative} `,
        (gm || (tokens.find((t) => t.id === c.tokenId) || {}).mine) && [h('button', { class: 'link', onclick: () => run(() => api('POST', `/api/scenes/${scene.id}/encounter/initiative`, { tokenId: c.tokenId })) }, 'roll'), ' '],
        gm && [h('button', { class: 'link', onclick: () => { const n = prompt(`Initiative for ${name(c.tokenId)}`, c.initiative); if (n !== null) put(encounter.combatants.map((x) => x === c ? { ...x, initiative: Number(n) } : x)); } }, 'set'), ' ',
          h('button', { class: 'link', onclick: () => encounter.combatants.length > 1 ? put(encounter.combatants.filter((x) => x !== c)) : run(() => api('DELETE', `/api/scenes/${scene.id}/encounter`)) }, 'remove')]))),
      gm && h('div', { style: 'display:flex;gap:8px' },
        h('button', { onclick: () => run(() => api('POST', `/api/scenes/${scene.id}/encounter/next`)) }, 'Next turn'),
        h('button', { onclick: () => run(() => api('DELETE', `/api/scenes/${scene.id}/encounter`)) }, 'End encounter'))],
    gm && [h('h3', {}, 'Tokens'), h('ul', {}, tokens.map((t) => h('li', {}, `${t.name} `,
      h('select', { 'aria-label': `${t.name} visible to`, onchange: (e) => run(() => api('PATCH', `/api/tokens/${t.id}`, { visibility: e.target.value })) }, options(['gm', 'party', 'public'], t.visibility)), ' ',
      h('button', { class: 'link', onclick: () => confirm(`Delete ${t.name}?`) && run(() => api('DELETE', `/api/tokens/${t.id}`)) }, 'delete'))))]));
}

function diceBox(v) {
  return [h('h3', {}, 'Dice'),
    v.role !== 'spectator' && h('form', { onsubmit: onSubmit(async (f) => api('POST', `/api/worlds/${state.world.id}/rolls`, { formula: f.formula, mode: f.mode, visibility: f.visibility, sceneId: v.scene.id })) },
      field('Formula', h('input', { name: 'formula', value: '1d20', size: 8, required: true })),
      field('Mode', h('select', { name: 'mode' }, options(['normal', 'advantage', 'disadvantage'], 'normal'))),
      field('Show to', h('select', { name: 'visibility' }, h('option', { value: 'public' }, 'everyone'), h('option', { value: 'private' }, 'me and the GM'),
        v.role === 'gm' && h('option', { value: 'gm' }, 'GM only'))),
      h('button', {}, 'Roll')),
    h('ol', { id: 'rolllog', 'aria-live': 'polite', style: 'padding-left:18px' })];
}

function sceneGmTools(v) {
  const s = v.scene;
  const players = (state.world.members || []).filter((m) => m.role === 'player');
  return [
    h('h3', {}, 'New token'),
    h('form', { id: 'tokform', onsubmit: (e) => e.preventDefault() },
      field('Name', h('input', { name: 'name', value: 'Goblin', size: 10 })),
      field('Colour', h('input', { name: 'color', type: 'color', value: '#b03a2e' })),
      field('Size', h('input', { name: 'size', type: 'number', min: 1, max: 6, value: 1, size: 2 })),
      field('Visible to', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], 'gm'))),
      field('Controlled by', h('select', { name: 'controller' }, h('option', { value: '' }, 'GM only'), players.map((m) => h('option', { value: m.userId }, m.name)))),
      field('Character', h('select', { name: 'characterId' }, h('option', { value: '' }, 'none'), state.chars.map((c) => h('option', { value: c.id }, c.name)))),
      h('p', { class: 'muted', style: 'margin:0' }, 'Choose “Place token”, then click the board.')),
    h('details', {}, h('summary', {}, 'Scene settings'),
      h('form', { onsubmit: onSubmit(async (f) => {
          await api('PATCH', `/api/scenes/${s.id}`, { name: f.name, visibility: f.visibility, grid: f.grid, cols: +f.cols, rows: +f.rows, backgroundUrl: f.backgroundUrl, fogEnabled: !!f.fogEnabled });
        }) },
        field('Name', h('input', { name: 'name', value: s.name })),
        field('Shared with', h('select', { name: 'visibility' }, options(['gm', 'party', 'public'], s.visibility))),
        field('Grid', h('select', { name: 'grid' }, options(['square', 'none'], s.grid))),
        field('Columns', h('input', { name: 'cols', type: 'number', min: 1, max: 200, value: s.cols, size: 3 })),
        field('Rows', h('input', { name: 'rows', type: 'number', min: 1, max: 200, value: s.rows, size: 3 })),
        check('Fog of war', 'fogEnabled', s.fog.enabled),
        h('label', { style: 'width:100%' }, 'Background image URL', h('input', { name: 'backgroundUrl', type: 'url', value: s.backgroundUrl })),
        h('button', {}, 'Save scene'))),
  ];
}

run(render);
</script>
</body>
</html>
